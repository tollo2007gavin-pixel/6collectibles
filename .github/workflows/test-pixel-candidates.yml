name: Test pixel whitening candidates

on:
  workflow_dispatch:
    inputs:
      geometry:
        description: 'Candidate sampling shape (no whitening API)'
        type: choice
        options: [triangle, square, circle, ring]
        default: triangle
      size_pixels:
        description: 'Size at 500px crop: triangle/square SIDE, circle DIAMETER, ring WIDTH'
        type: choice
        options: ['5', '8', '10', '12', '15', '20', '30', '40', '60']
        default: '12'
      blue_percentage:
        description: 'Exclude candidate when sampled blue reaches this percentage'
        type: choice
        options: ['40', '50', '60', '70', '75', '80', '85', '90', '95']
        default: '60'
      large_damage_exception:
        description: 'Keep large marks even if they reach the blue threshold'
        type: boolean
        default: true
      replay_run_id:
        description: 'Previous card-results GitHub RUN ID: reuse saved sheets; blank = new eBay batch'
        type: string
        default: ''
      max_listings:
        description: 'Maximum listings (missing sheets are reported, never marked clean)'
        type: number
        default: 20
      border_type:
        description: 'Approved card searches for new eBay batches'
        type: choice
        options: [yellow, gx, all]
        default: yellow
      card_ids:
        description: 'Approved IDs as JSON list; [] = all selected designs'
        type: string
        default: '[]'

permissions:
  contents: read
  actions: read

concurrency:
  group: pixel-candidate-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      PIXEL_TEST_INPUTS: ${{ toJSON(inputs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements_runner.txt
      - run: python -m pip install -r requirements_runner.txt
      - name: Validate options and test candidate evaluation offline
        run: |
          python -c "import os,json; from pixel_workflow import settings; settings(json.loads(os.environ['PIXEL_TEST_INPUTS']))"
          python -m unittest test_pixel_whitening test_blue_surround test_triangle_blue test_pixel_workflow test_detection_mode
      - name: Download previous photos and sheets
        if: ${{ inputs.replay_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.replay_run_id }}
          pattern: card-results-*
          path: replay_batch
          merge-multiple: true
      - name: Prepare sheets and evaluate candidates (no OpenAI key)
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python pixel_workflow.py
      - name: Save candidate review and reproducible settings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-results-pixel-${{ github.run_number }}
          path: outputs/pixel_tests/
          if-no-files-found: warn
          retention-days: 14
