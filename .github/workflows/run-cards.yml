name: Run card pipeline

on:
  workflow_dispatch:
    inputs:
      border_type:
        description: 'Approved border designs (each card uses only its assigned fitter)'
        type: choice
        options: [yellow, gx, all]
        default: yellow
      pipeline:
        description: 'Pipelines: both = centering first, then whitening for passes'
        type: choice
        options: [both, centering, api]
        default: both
      output_mode:
        description: 'production = accepted summaries; testing = all results and images'
        type: choice
        options: [testing, production]
        default: testing
      max_listings:
        description: 'Maximum eligible listings analyzed (not number of passes)'
        type: number
        default: 45
      max_listing_age_hours:
        description: 'Maximum hours since listing started; null = any age'
        type: string
        default: 'null'
      max_listings_per_card:
        description: 'Maximum listings analyzed per active card query'
        type: number
        default: 3
      card_ids:
        description: 'Approved IDs as JSON, e.g. ["22"] or ["eevee_sm233"]; [] = all selected borders'
        type: string
        default: '[]'
      centering_max_side_pct:
        description: '53 means 47/53 or better on both axes'
        type: number
        default: 53
      allow_angular_variance:
        description: 'Allow existing +/-1-point overlap for qualifying yellow-border photos'
        type: boolean
        default: true
      target_passes:
        description: 'Stop after this many accepted listings; 0 = full batch'
        type: number
        default: 0
      max_whitening_cards:
        description: 'Maximum paid whitening evaluations (up to 3 API calls each)'
        type: number
        default: 15
      prepare_api_only:
        description: 'Prepare back crops without paid API calls (not a passing assessment)'
        type: boolean
        default: false
      max_candidates_per_card:
        description: 'Search/detail budget per query, including unsuitable listings'
        type: number
        default: 100
      check_only:
        description: 'Validate setup only: no eBay fetching or paid API calls'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: manual-card-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
      CARD_RUN_INPUTS: ${{ toJSON(inputs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements_runner.txt
      - name: Install production dependencies
        run: python -m pip install -r requirements_runner.txt
      - name: Check settings and reference files
        run: python run_cards.py --check
      - name: Check whitening and back-photo handling (offline)
        run: python -m unittest test_luna_whitening test_back_photo_fallback test_card_runner test_card_review
      - name: Check review interactions (offline)
        run: node test_card_review_ui.js
      - name: Run selected pipelines
        if: ${{ !inputs.check_only }}
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python run_cards.py
      - name: Save results even when the run fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-results-${{ github.run_number }}
          path: outputs/card_runs/
          if-no-files-found: warn
          retention-days: 14
